version: 1
transforms:
  # Change made in https://github.com/flutter/packages/pull/13603
  - title: "Migrate to 'scrollCacheExtent'"
    date: 2026-11-17
    element:
      uris: [ 'two_dimensional_scrollables.dart', 'package:two_dimensional_scrollables/two_dimensional_scrollables.dart' ]
      constructor: ''
      inClass: 'TableView'
    oneOf:
      - if: "cacheExtent != '' && scrollCacheExtent != '' && scrollCacheExtent != 'null'"
        changes:
          - kind: 'removeParameter'
            name: 'cacheExtent'
      - if: "cacheExtent == 'null'"
        changes:
          - kind: 'removeParameter'
            name: 'cacheExtent'
      - if: "cacheExtent != '' && scrollCacheExtent == 'null'"
        changes:
          - kind: 'removeParameter'
            name: 'scrollCacheExtent'
          - kind: 'addParameter'
            index: 0
            name: 'scrollCacheExtent'
            style: optional_named
            argumentValue:
              expression: 'ScrollCacheExtent.pixels({% cacheExtent %})'
              requiredIf: "cacheExtent != ''"
          - kind: 'removeParameter'
            name: 'cacheExtent'
      - if: "cacheExtent != '' && scrollCacheExtent == ''"
        changes:
          - kind: 'addParameter'
            index: 0
            name: 'scrollCacheExtent'
            style: optional_named
            argumentValue:
              expression: 'ScrollCacheExtent.pixels({% cacheExtent %})'
              requiredIf: "cacheExtent != ''"
          - kind: 'removeParameter'
            name: 'cacheExtent'
    variables:
      cacheExtent:
        kind: 'fragment'
        value: 'arguments[cacheExtent]'
      scrollCacheExtent:
        kind: 'fragment'
        value: 'arguments[scrollCacheExtent]'

