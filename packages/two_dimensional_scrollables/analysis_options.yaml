# This custom rule set only exists to allow very targeted changes
# relative to the default repo settings, for specific use cases.
# Please do NOT add more changes here without consulting with
# #hackers-ecosystem on Discord.

include: ../../analysis_options.yaml

analyzer:
  exclude:
    # This directory deliberately has deprecated usages, to test `dart fix`.
    - "test_fixes/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  # These are repeated from ../../analysis_options.yaml because pana cannot see
  # the shared options when the package is published.
  errors:
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore

# These are repeated from ../../analysis_options.yaml because pana cannot see
# the shared options when the package is published.
formatter:
  page_width: 100
