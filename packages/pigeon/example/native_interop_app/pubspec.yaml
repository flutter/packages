name: pigeon_native_interop_app
description: An example of using Pigeon with Native Interop in an application.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.2.0
  ffigen: ^21.0.0
  flutter:
    sdk: flutter
  jni: ^1.0.3
  jnigen: ^0.17.0
  logging: ^1.3.0
  objective_c: ^9.5.0
  pigeon:
    path: ../../
  pub_semver: ^2.1.4
  swift2objc: ^0.2.0
  swiftgen: ^0.1.3

dev_dependencies:
  build_runner: ^2.1.10
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true


