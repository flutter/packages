name: pigeon_native_interop_app
description: An example of using Pigeon with Native Interop in an application.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  jni: ^1.0.3
  objective_c: ^9.5.0

dev_dependencies:
  build_runner: ^2.1.10
  # TODO(QuncCccccc): Remove the upper bound once swiftgen supports ffigen
  # 22.1.0, which removed `defaultCompilerOpts`.
  # https://github.com/dart-lang/native/issues/3723
  ffigen: ">=22.0.0 <22.1.0"
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # TODO(QuncCccccc): Remove the upper bound and regenerate the JNI bindings
  # with jnigen 1.0.1+, along with removing the ffigen pin above.
  # https://github.com/dart-lang/native/issues/3723
  jnigen: ">=1.0.0 <1.0.1"
  logging: ^1.3.0
  pigeon:
    path: ../../
  pub_semver: ^2.1.4
  swift2objc: ^0.3.0
  swiftgen: ^0.2.0

flutter:
  uses-material-design: true


