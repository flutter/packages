name: pigeon_native_interop_app
description: An example of using Pigeon with Native Interop in an application.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.0

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  jni: ^1.1.1
  # TODO(tarrinneal): Remove the upper bound once objective_c's debug object
  # validity check handles runtime-allocated classes on the iOS simulator.
  # See https://github.com/dart-lang/native/pull/3788.
  # 9.6.3's check masks the isa with a class mask that is too narrow there, so
  # it rejects valid ObjCProtocolBuilder instances.
  objective_c: ">=9.6.2 <9.6.3"

dev_dependencies:
  build_runner: ^2.1.10
  ffigen: 22.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  jnigen: 1.0.1
  logging: ^1.3.0
  pigeon:
    path: ../../
  pub_semver: ^2.1.4
  swift2objc: 0.3.1
  swiftgen: 0.2.0

flutter:
  uses-material-design: true


