name: swift_concurrency_test_plugin
description: Pigeon test harness for Swift 6 strict concurrency.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SwiftConcurrencyTestPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: SwiftConcurrencyTestPlugin
        sharedDarwinSource: true

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
