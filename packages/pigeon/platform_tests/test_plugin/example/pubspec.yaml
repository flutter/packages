name: test_plugin_example
description: Pigeon test harness for primary plugin languages.
publish_to: 'none'

environment:
  sdk: ^3.11.0

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  jni: ^1.0.3
  objective_c: ^9.5.0
  pub_semver: ^2.2.0
  shared_test_plugin_code:
    path: ../../shared_test_plugin_code
  test_plugin:
    path: ../

dev_dependencies:
  # TODO(QuncCccccc): Remove the upper bound once swiftgen supports ffigen
  # 22.1.0, which removed `defaultCompilerOpts`.
  # https://github.com/dart-lang/native/issues/3723
  ffigen: ">=22.0.0 <22.1.0"
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # TODO(QuncCccccc): Remove the upper bound and regenerate the JNI bindings
  # with jnigen 1.0.1+, along with removing the ffigen pin above.
  # https://github.com/dart-lang/native/issues/3723
  jnigen: ">=1.0.0 <1.0.1"
  logging: ^1.3.0
  pigeon:
    path: ../../..
  swift2objc: ^0.3.0
  swiftgen: ^0.2.0

flutter:
  uses-material-design: true