name: shared_test_plugin_code
description: Common code for test_plugin and alternate_language_test_plugin
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  build_runner: ^2.1.10
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  # These are normal dependencies rather than dev_dependencies because the
  # package exports the integration test code to be shared by the integration
  # tests for the two plugins.
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  jni: ^1.0.3
  meta: ^1.17.0
  mockito: ^5.4.4
  objective_c: ^9.5.0

dev_dependencies:
  ffigen: ^21.0.0
  jnigen: ^0.17.0
  leak_tracker: any