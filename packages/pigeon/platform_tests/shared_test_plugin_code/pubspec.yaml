name: shared_test_plugin_code
description: Common code for test_plugin and alternate_language_test_plugin
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  build_runner: ^2.1.10
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  # These are normal dependencies rather than dev_dependencies because the
  # package exports the integration test code to be shared by the integration
  # tests for the two plugins.
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  jni: ^1.1.1
  meta: ^1.17.0
  mockito: ^5.4.4
  # TODO(tarrinneal): Remove the upper bound once objective_c's debug object
  # validity check handles runtime-allocated classes on the iOS simulator.
  # See https://github.com/dart-lang/native/pull/3788.
  # 9.6.3's check masks the isa with a class mask that is too narrow there, so
  # it rejects valid ObjCProtocolBuilder instances.
  objective_c: ">=9.6.2 <9.6.3"

dev_dependencies:
  ffigen: 22.0.0
  jnigen: 1.0.1
  leak_tracker: any