name: shared_test_plugin_code
description: Common code for test_plugin and alternate_language_test_plugin
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  build_runner: ^2.1.10
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  # These are normal dependencies rather than dev_dependencies because the
  # package exports the integration test code to be shared by the integration
  # tests for the two plugins.
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  jni: ^1.0.3
  meta: ^1.17.0
  mockito: ^5.4.4
  objective_c: ^9.5.0

dev_dependencies:
  # TODO(QuncCccccc): Remove the upper bound once swiftgen supports ffigen
  # 22.1.0, which removed `defaultCompilerOpts`.
  # https://github.com/dart-lang/native/issues/3723
  ffigen: ">=22.0.0 <22.1.0"
  # TODO(QuncCccccc): Remove the upper bound and regenerate the JNI bindings
  # with jnigen 1.0.1+, along with removing the ffigen pin above.
  # https://github.com/dart-lang/native/issues/3723
  jnigen: ">=1.0.0 <1.0.1"
  leak_tracker: any