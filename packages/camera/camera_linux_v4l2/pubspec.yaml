name: camera_linux_v4l2
description: Linux implementation of the camera plugin using V4L2.
repository: https://github.com/flutter/packages/tree/main/packages/camera/camera_linux_v4l2
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+camera%22
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: camera
    platforms:
      linux:
        pluginClass: CameraLinuxV4l2Plugin
        dartPluginClass: CameraLinuxV4l2

dependencies:
  camera_platform_interface: ^2.14.0
  flutter:
    sdk: flutter
  meta: ^1.10.0
  stream_transform: ^2.0.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.0
  pigeon: ^27.3.2

topics:
  - camera
