name: camera_linux
description: Linux implementation of the camera plugin. Captures from V4L2 webcams through a Dart build hook, with no native dependencies.
repository: https://github.com/flutter/packages/tree/main/packages/camera/camera_linux
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+camera%22
version: 0.1.0

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    implements: camera
    platforms:
      linux:
        dartPluginClass: CameraLinux

dependencies:
  camera_platform_interface: ^2.14.0
  code_assets: ^1.1.0
  cross_file: ^0.3.1
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  hooks: ^2.0.0
  logging: ^1.3.0
  meta: ^1.10.0
  native_toolchain_c: ^0.19.0
  stream_transform: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  image: 4.12.0
  qr: ^4.0.1

topics:
  - camera
