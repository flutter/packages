changelog: |
  - Updates `ModalBottomSheetRoute` and `showModalBottomSheet` so dragging, flinging, or otherwise closing a modal bottom sheet now respects `PopScope` (and `WillPopScope`). When a pop is prevented (`canPop: false`), `onPopInvokedWithResult` is called with `didPop: false` and the sheet animates back to its open position instead of dismissing.
version: minor
