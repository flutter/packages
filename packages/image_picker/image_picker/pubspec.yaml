name: image_picker
description: Flutter plugin for selecting images from the Android and iOS image
  library, and taking new pictures with the camera.
repository: https://github.com/flutter/packages/tree/main/packages/image_picker/image_picker
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+image_picker%22
version: 1.2.4

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: image_picker_android
      ios:
        default_package: image_picker_ios
      linux:
        default_package: image_picker_linux
      macos:
        default_package: image_picker_macos
      web:
        default_package: image_picker_for_web
      windows:
        default_package: image_picker_windows

dependencies:
  flutter:
    sdk: flutter
  image_picker_android: ^0.8.13
  image_picker_for_web: ^3.1.0
  image_picker_ios: ^0.8.13
  image_picker_linux: ^0.2.2
  image_picker_macos: ^0.2.2
  image_picker_platform_interface: ^2.11.0
  image_picker_windows: ^0.2.2

dev_dependencies:
  cross_file_platform_interface: ^1.0.0
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.7

topics:
  - camera
  - image-picker
  - files
  - file-selection
# FOR TESTING AND INITIAL REVIEW ONLY. DO NOT MERGE.
# See https://github.com/flutter/flutter/blob/master/docs/ecosystem/contributing/README.md#changing-federated-plugins
dependency_overrides:
  file_selector_linux:
    git:
      url: git@github.com:bparrishMines/packages.git
      ref: file_selector_2
      path: packages/file_selector/file_selector_linux
  file_selector_macos:
    git:
      url: git@github.com:bparrishMines/packages.git
      ref: file_selector_2
      path: packages/file_selector/file_selector_macos
  file_selector_platform_interface:
    git:
      url: git@github.com:bparrishMines/packages.git
      ref: file_selector_2
      path: packages/file_selector/file_selector_platform_interface
  file_selector_windows:
    git:
      url: git@github.com:bparrishMines/packages.git
      ref: file_selector_2
      path: packages/file_selector/file_selector_windows
  image_picker_android: {path: ../../../packages/image_picker/image_picker_android}
  image_picker_for_web: {path: ../../../packages/image_picker/image_picker_for_web}
  image_picker_ios: {path: ../../../packages/image_picker/image_picker_ios}
  image_picker_linux: {path: ../../../packages/image_picker/image_picker_linux}
  image_picker_macos: {path: ../../../packages/image_picker/image_picker_macos}
  image_picker_platform_interface: {path: ../../../packages/image_picker/image_picker_platform_interface}
  image_picker_windows: {path: ../../../packages/image_picker/image_picker_windows}
