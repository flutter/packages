name: file_selector_android
description: Android implementation of the file_selector package.
repository: https://github.com/flutter/packages/tree/main/packages/file_selector/file_selector_android
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+file_selector%22
version: 0.6.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: file_selector
    platforms:
      android:
        dartPluginClass: FileSelectorAndroid
        package: dev.flutter.packages.file_selector_android
        pluginClass: FileSelectorAndroidPlugin

dependencies:
  file_selector_platform_interface: ^3.0.0
  flutter:
    sdk: flutter
  meta: ^1.10.0
  plugin_platform_interface: ^2.1.7

dev_dependencies:
  build_runner: ^2.1.4
  cross_file_platform_interface: ^1.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  pigeon: ^27.3.2

topics:
  - files
  - file-selection
  - file-selector
# FOR TESTING AND INITIAL REVIEW ONLY. DO NOT MERGE.
# See https://github.com/flutter/flutter/blob/master/docs/ecosystem/contributing/README.md#changing-federated-plugins
dependency_overrides:
  file_selector_platform_interface: {path: ../../../packages/file_selector/file_selector_platform_interface}
