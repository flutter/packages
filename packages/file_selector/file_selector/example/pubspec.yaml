name: file_selector_example
description: A new Flutter project.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  file_selector:
    # When depending on this package from a real application you should use:
    #   file_selector: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../
  flutter:
    sdk: flutter
  path_provider: ^2.0.9

dev_dependencies:
  build_runner: ^2.1.10
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
# FOR TESTING AND INITIAL REVIEW ONLY. DO NOT MERGE.
# See https://github.com/flutter/flutter/blob/master/docs/ecosystem/contributing/README.md#changing-federated-plugins
dependency_overrides:
  file_selector: {path: ../../../../packages/file_selector/file_selector}
  file_selector_android: {path: ../../../../packages/file_selector/file_selector_android}
  file_selector_ios: {path: ../../../../packages/file_selector/file_selector_ios}
  file_selector_linux: {path: ../../../../packages/file_selector/file_selector_linux}
  file_selector_macos: {path: ../../../../packages/file_selector/file_selector_macos}
  file_selector_platform_interface: {path: ../../../../packages/file_selector/file_selector_platform_interface}
  file_selector_web: {path: ../../../../packages/file_selector/file_selector_web}
  file_selector_windows: {path: ../../../../packages/file_selector/file_selector_windows}
