name: cross_file_darwin
description: Implementation of cross_file_platform_interface for iOS and macOS.
repository: https://github.com/flutter/packages/tree/main/packages/cross_file/cross_file_darwin
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+cross_file%22
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

flutter:
  plugin:
    implements: cross_file
    platforms:
      ios:
        dartPluginClass: CrossFileDarwin
        pluginClass: CrossFileDarwinPlugin
        sharedDarwinSource: true
      macos:
        dartPluginClass: CrossFileDarwin
        pluginClass: CrossFileDarwinPlugin
        sharedDarwinSource: true

dependencies:
  # TODO(bparrishMines): Change this to hosted dependency once `cross_file_io` is released.
  cross_file_io:
    path: ../cross_file_io
  # TODO(bparrishMines): Change this to hosted dependency once `cross_file_platform_interface` is
  # released.
  cross_file_platform_interface:
    path: ../cross_file_platform_interface
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  objective_c: ^9.5.0
  path: ^1.9.1

dev_dependencies:
  build_runner: ^2.15.1
  ffigen: ^21.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.6.4
  pigeon: ^27.3.2

topics:
  - file
  - cross-file
