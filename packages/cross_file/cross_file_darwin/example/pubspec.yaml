name: cross_file_darwin_example
description: "Demonstrates how to use the cross_file_darwin plugin."
publish_to: 'none'

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  cross_file_darwin:
    # When depending on this package from a real application you should use:
    #   cross_file_darwin: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../
  # TODO(bparrishMines): Change this to hosted dependency once `cross_file_platform_interface` is
  # released.
  cross_file_platform_interface:
    path: ../../cross_file_platform_interface
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  mime: ^2.0.0

dev_dependencies:
  # TODO(bparrishMines): Change this to hosted dependency once `cross_file_io` is released.
  cross_file_io:
    path: ../../../cross_file/cross_file_io
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6

flutter:
  uses-material-design: true
  assets:
    - assets/hello.txt
