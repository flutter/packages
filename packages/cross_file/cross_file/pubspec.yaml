name: cross_file
description: An abstraction to allow working with files across multiple platforms.
repository: https://github.com/flutter/packages/tree/main/packages/cross_file/cross_file
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+cross_file%22
version: 0.4.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: cross_file_android
      ios:
        default_package: cross_file_darwin
      linux:
        default_package: cross_file_io
      macos:
        default_package: cross_file_darwin
      web:
        default_package: cross_file_web
      windows:
        default_package: cross_file_io

dependencies:
  # TODO(bparrishMines): Change this to hosted dependency once `cross_file_android` is released.
  cross_file_android:
    path: ../cross_file_android
  # TODO(bparrishMines): Change this to hosted dependency once `cross_file_darwin` is released.
  cross_file_darwin:
    path: ../cross_file_darwin
  # TODO(bparrishMines): Change this to hosted dependency once `cross_file_io` is released.
  cross_file_io:
    path: ../cross_file_io
  # TODO(bparrishMines): Change this to hosted dependency once `cross_file_platform_interface` is
  # released.
  cross_file_platform_interface:
    path: ../cross_file_platform_interface
  # TODO(bparrishMines): Change this to hosted dependency once `cross_file_web` is released.
  cross_file_web:
    path: ../cross_file_web
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

topics:
  - files
  - cross-file
