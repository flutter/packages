name: PR 12924 review fixes

on:
  push:
    branches:
      - fix-go-router-sdk-app-pages

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true
      - name: Resolve go_router dependencies
        working-directory: packages/go_router
        run: flutter pub get
      - name: Apply cache invalidation fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/go_router/lib/src/builder.dart')
          s = p.read_text()
          old = ('    // This method can also be called if any of the page builders depend on\n'
                 '    // the context. In this case, make sure _pages are rebuilt.\n'
                 '    _pages = null;')
          new = ('    // This method can also be called if any of the page builders depend on\n'
                 '    // the context. In this case, make sure the app-type builders and pages are\n'
                 '    // recomputed from the current ancestor tree.\n'
                 '    _pageBuilderForAppType = null;\n'
                 '    _errorBuilderForAppType = null;\n'
                 '    _pages = null;')
          if old not in s:
              raise SystemExit('didChangeDependencies block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format changed Dart files
        run: dart format packages/go_router/lib/src/builder.dart packages/go_router/lib/src/pages/app_type.dart packages/go_router/lib/src/pages/cupertino.dart packages/go_router/lib/src/pages/material.dart packages/go_router/test/sdk_app_test.dart
      - name: Run full go_router test suite
        working-directory: packages/go_router
        run: flutter test
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "Yazan Arafeh"
          git config user.email "32390922+yazanmg@users.noreply.github.com"
          git add packages/go_router/lib/src/builder.dart packages/go_router/lib/src/pages/app_type.dart packages/go_router/lib/src/pages/cupertino.dart packages/go_router/lib/src/pages/material.dart packages/go_router/test/sdk_app_test.dart
          git rm .github/workflows/pr12924-review-fixes.yml
          git commit -m "Invalidate go_router app-type caches on dependency changes"
          git push origin HEAD:fix-go-router-sdk-app-pages
