name: PR 12924 format validation

on:
  push:
    branches:
      - fix-go-router-sdk-app-pages

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.21.0
        with:
          channel: master
      - name: Format changed Dart files
        run: |
          dart format \
            packages/go_router/lib/src/builder.dart \
            packages/go_router/lib/src/pages/app_type.dart \
            packages/go_router/lib/src/pages/cupertino.dart \
            packages/go_router/lib/src/pages/material.dart \
            packages/go_router/test/sdk_app_test.dart
      - name: Resolve go_router dependencies
        working-directory: packages/go_router
        run: flutter pub get
      - name: Run targeted go_router regression tests
        working-directory: packages/go_router
        run: flutter test test/sdk_app_test.dart
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "Yazan Arafeh"
          git config user.email "32390922+yazanmg@users.noreply.github.com"
          git rm .github/workflows/pr12924-format.yml
          git add packages/go_router/lib/src/builder.dart packages/go_router/lib/src/pages/app_type.dart packages/go_router/lib/src/pages/cupertino.dart packages/go_router/lib/src/pages/material.dart packages/go_router/test/sdk_app_test.dart
          git commit -m "Format go_router SDK app compatibility changes"
          git push origin HEAD:fix-go-router-sdk-app-pages
